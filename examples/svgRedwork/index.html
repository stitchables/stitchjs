<!doctype html>
<html>
<head>
  <title>SVG Redwork Example</title>
  <script src="../../dist/stitch.global.js"></script>
  <script>window.Stitch || document.write('<script src="https://unpkg.com/@stitchables/stitchjs/dist/stitch.global.js">\x3C/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.2/lib/p5.js"></script>
  <script src="https://unpkg.com/svg2wkt"></script>
  <script src="https://unpkg.com/jsts@2.12.1/dist/jsts.min.js"></script>
</head>
<body style="margin: 0;">
<script>

  // const [file, includeBorder, density] = ['./GreatScott.svg', false, 0.25];
  // const [file, includeBorder, density] = ['./Maze.svg', false, 0.25];
  // const [file, includeBorder, density] = ['./torus.txt', true, 0.25];
  const [file, includeBorder, density] = ['./Sugar_Skull.txt', false, 2];
  // const [file, includeBorder, density] = ['./firebird.txt', false, 0.25];
  // const [file, includeBorder, density] = ['./sparrow.txt', false, 0.1];

  function fitGeometryInsideScreen(g) {
    const envelope = g.getEnvelopeInternal();
    const s = Math.min(width / envelope.getWidth(), height / envelope.getHeight());
    const tx = width / 2 - ((envelope.getMinX() + envelope.getMaxX()) / 2) * s;
    const ty = height / 2 - ((envelope.getMinY() + envelope.getMaxY()) / 2) * s;
    return jsts.geom.util.AffineTransformation.scaleInstance(s, s).compose(
      jsts.geom.util.AffineTransformation.translationInstance(tx, ty)
    ).transform(g);
  }

  const reader = new jsts.io.WKTReader();
  let geometry, pattern, run, stitches;
  async function setup() {
    createCanvas(window.innerWidth, window.innerHeight);
    await Stitch.init();
    const svgStrings = await loadStrings(file);
    geometry = fitGeometryInsideScreen(reader.read(svg2wkt.svgToWkt(svgStrings.join('\n'), { flipY: false, density })));
    const lines = jsts.geom.util.LinearComponentExtracter.getLines(geometry).toArray()
      .map(l => l.getCoordinates().map(c => new Stitch.Math.Vector(c.x, c.y)));
    if (includeBorder) {
      lines.push(geometry.getEnvelope().getExteriorRing().getCoordinates().map(c => new Stitch.Math.Vector(c.x, c.y)));
    }
    run = new Stitch.Core.Runs.Redwork(lines, {
      entry: new Stitch.Math.Vector(300, 0),
      stitchLengthMm: 3,
      stitchToleranceMm: 0.1,
      densifyDistancePx: 10,
      precisionModelScale: 10,
    });
    pattern = new Stitch.Core.Pattern(width, height);
    const thread = pattern.addThread(0, 0, 0);
    thread.addRun(run);

    let modal = Stitch.Browser.Modal.createDownloadModal(pattern, 'redWorkHandStreamlines', 10, 500);
    document.body.appendChild(modal.container);
    window.addEventListener('click', (e) => {
      if (e.target === modal.container) modal.close();
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyD') modal.open();
    });

    stitches = run.getStitches(5);
  }

  async function draw() {
    background(0);

    noFill();
    stroke(255, 0, 0, 200);
    drawGeom(geometry);

    if (stitches && stitches.length > 0) {
      const stitchLimit = Math.round(map(mouseX, 50, width - 50, 0, stitches.length, true));
      noFill();
      stroke(255);
      let prev = stitches[0].position;
      for (let i = 1; i < stitchLimit; i++) {
        const offset = map(i, 1, stitches.length, 0, 0);
        const curr = stitches[i].position;
        line(prev.x, prev.y + offset, curr.x, curr.y + offset);
        prev = curr;
      }
    }
  }

  function drawGeom(g) {
    let geomType = g.getGeometryType();
    if (geomType === 'MultiLineString') {
      for (let i = 0, n = g.getNumGeometries(); i < n; i++) {
        drawGeom(g.getGeometryN(i));
      }
    } else if (geomType === 'LineString' || geomType === 'LinearRing') {
      beginShape();
      for (let i = 0, n = g.getNumPoints(); i < n; i++) {
        const p = g.getPointN(i);
        vertex(p.getX(), p.getY());
      }
      endShape();
    } else if (geomType === 'Polygon') {
      const shell = g.getExteriorRing();
      beginShape();
      for (let i = 0, n = shell.getNumPoints(); i < n; i++) {
        const p = shell.getPointN(i);
        vertex(p.getX(), p.getY());
      }
      for (let i = 0, n = g.getNumInteriorRing(); i < n; i++) {
        const hole = g.getInteriorRingN(i);
        beginContour();
        for (let j = 0, m = hole.getNumPoints(); j < m; j++) {
          const p = hole.getPointN(j);
          vertex(p.getX(), p.getY());
        }
        endContour(CLOSE);
      }
      endShape(CLOSE);
    } else if (geomType === 'GeometryCollection') {
      for (let i = 0, n = g.getNumGeometries(); i < n; i++) {
        drawGeom(g.getGeometryN(i));
      }
    } else if (geomType === 'Point') {
      const coord = g.getCoordinate();
      circle(coord.x, coord.y, 5);
    } else if (geomType === 'MultiPolygon') {
      for (let i = 0, n = g.getNumGeometries(); i < n; i++) {
        drawGeom(g.getGeometryN(i));
      }
    }
    else {
      console.log(`Unrecognized Geometry Type: ${geomType}`);
    }
  }

</script>
</body>
</html>
