  function pathStringToPoints(pathString, spacing = 2) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", pathString);
    const points = [];
    const totalLength = path.getTotalLength();
    for (let d = 0; d < totalLength; d += spacing) {
      const { x, y } = path.getPointAtLength(d);
      points.push({ x, y });
    }
    return points;
  }
  function fitBoxInsideBox(inner, outer) {
    const iw = inner.xMax - inner.xMin;
    const ih = inner.yMax - inner.yMin;
    const ow = outer.xMax - outer.xMin;
    const oh = outer.yMax - outer.yMin;
    const s = Math.min(ow / iw, oh / ih);
    const innerCx = (inner.xMin + inner.xMax) / 2;
    const innerCy = (inner.yMin + inner.yMax) / 2;
    const outerCx = (outer.xMin + outer.xMax) / 2;
    const outerCy = (outer.yMin + outer.yMax) / 2;
    const t = { x: outerCx - innerCx * s, y: outerCy - innerCy * s };
    return { t, s };
  }
  function fitGeometryToScreen(geom) {
    const bbScreen = {
      xMin: 0.05 * width, yMin: 0.05 * height,
      xMax: 0.95 * width, yMax: 0.95 * height,
    };
    const env = geom.getEnvelopeInternal();
    const bbSvg = {
      xMin: env.getMinX(), yMin: env.getMinY(),
      xMax: env.getMaxX(), yMax: env.getMaxY(),
    };
    const { t, s } = fitBoxInsideBox(bbSvg, bbScreen);
    return scaleInstance(s, s)
      .compose(translationInstance(t.x, t.y))
      .transform(geom);
  }

  const [width, height] = [800, 800];

  const polygons = [];
  for (const svgPath of svgPaths) {
    const rings = [];
    for (let s of svgPath) {
      const path = pathStringToPoints(s).map(p => new Coordinate(p.x, p.y));
      rings.push(gf.createLinearRing([...path, path[0]]));
    }
    polygons.push(gf.createPolygon(rings[0], rings.slice(1)));
  }
  const mask = fitGeometryToScreen(gf.createMultiPolygon(polygons));

  const dSep = 10;
  const offset = { x: 10000 * Math.random() + 1000, y: 10000 * Math.random() + 1000 };
  const essLines = [];
  const handle = streamlines.computeStreamlines({
    vectorField: (x, y) => {
      const angle = map(noise((x + offset.x) / 400, (y + offset.y) / 400), 0, 1, 0, 2 * Math.PI);
      const out = new Vector(x, y).rotate(angle);
      return { x: out.x, y: out.y };
    },
    boundingBox: { left: 0, top: 0, width, height },
    dSep: dSep,
    dTest: 0.5 * dSep,
    timeStep: 0.5,
    onStreamlineAdded(s) {
      const line = gf.createLineString(s.points.map(p => new Coordinate(p.x, p.y)));
      essLines.push(line);
    }
  });
  await handle.done;
  const maskedEssLines = mask.intersection(gf.createMultiLineString(essLines));

  const pattern = new Stitch.Core.Pattern(width, height);
  const thread = pattern.addThread(0, 0, 0);

  thread.addRun(new Stitch.Core.Runs.Redwork(
    [
      ...LineStringExtracter.getLines(maskedEssLines).toArray().map(l => l.getCoordinates().map(c => new Vector(c.x, c.y))),
      ...LineStringExtracter.getLines(mask.getBoundary()).toArray().map(l => l.getCoordinates().map(c => new Vector(c.x, c.y)))
    ],
    {
      entry: new Vector(0, 0),
      stitchLengthMm: 3,
      stitchToleranceMm: 0.1,
    }
  ));


  let canvas = Stitch.Graphics.getCanvas(pattern, window.innerWidth, window.innerHeight, 5);
  canvas.setAttribute('style', 'margin: auto; position: absolute; inset: 0;');
  document.body.append(canvas);

  let modal = Stitch.Browser.Modal.createDownloadModal(pattern, 'redWorkHandStreamlines', 10, 500);
  document.body.appendChild(modal.container);
  window.addEventListener('click', (e) => {
    if (e.target === modal.container) modal.close();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyD') modal.open();
  });

  window.addEventListener("resize", Stitch.Browser.Utils.debounce(() => {
